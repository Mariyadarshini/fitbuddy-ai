<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1830" viewBox="0 0 1200 1830">
<rect width="1200" height="1830" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#222"/></marker><style>.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.decision{fill:#fff;stroke:#222;stroke-width:2}.txt{font-family:Arial,sans-serif;font-size:22px;fill:#111;text-anchor:middle}.small{font-size:18px}.line{stroke:#222;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<text x="600" y="40" class="txt" font-size="30">FitBuddy AI — System Flowchart</text>
<rect x="450" y="70" width="300" height="70" rx="35" class="box"/><text x="600.0" y="113.0" class="txt">START</text>
<path d="M600 140 V180" class="line"/>
<rect x="390" y="180" width="420" height="80" rx="12" class="box"/><text x="600.0" y="214.0" class="txt">Open FitBuddy AI</text><text x="600.0" y="242.0" class="txt small">Home page with planner form</text>
<path d="M600 260 V300" class="line"/>
<rect x="330" y="300" width="540" height="90" rx="12" class="box"/><text x="600.0" y="339.0" class="txt">Enter Details</text><text x="600.0" y="367.0" class="txt small">Name, User ID, Age, Weight, Goal, Intensity</text>
<path d="M600 390 V430" class="line"/>
<polygon points="600,430 790.0,495.0 600,560 410.0,495.0" class="decision"/><text x="600" y="503.0" class="txt">Input valid?</text>
<path d="M790 495 H900" class="line"/>
<text x="815" y="485" class="txt small" style="text-anchor:start">No</text>
<rect x="900" y="460" width="260" height="70" rx="12" class="box"/><text x="1030.0" y="503.0" class="txt">Show error page</text>
<path d="M1030 460 V345 H870" class="line"/>
<path d="M600 560 V610" class="line"/>
<text x="615" y="590" class="txt small" style="text-anchor:start">Yes</text>
<polygon points="600,610 790.0,675.0 600,740 410.0,675.0" class="decision"/><text x="600" y="683.0" class="txt">Gemini available?</text>
<path d="M410 675 H340" class="line"/>
<text x="365" y="665" class="txt small" style="text-anchor:start">No</text>
<rect x="60" y="640" width="280" height="70" rx="12" class="box"/><text x="200.0" y="669.0" class="txt">Local fallback</text><text x="200.0" y="697.0" class="txt small">generator</text>
<path d="M200 710 V960 H390" class="line"/>
<path d="M600 740 V780" class="line"/>
<text x="615" y="768" class="txt small" style="text-anchor:start">Yes</text>
<rect x="390" y="780" width="420" height="80" rx="12" class="box"/><text x="600.0" y="814.0" class="txt">Generate plan with Gemini</text><text x="600.0" y="842.0" class="txt small">Structured JSON response</text>
<path d="M600 860 V920" class="line"/>
<rect x="390" y="920" width="420" height="80" rx="12" class="box"/><text x="600.0" y="954.0" class="txt">7-day plan ready</text><text x="600.0" y="982.0" class="txt small">Validated: exactly 7 days</text>
<path d="M600 1000 V1040" class="line"/>
<rect x="390" y="1040" width="420" height="80" rx="12" class="box"/><text x="600.0" y="1088.0" class="txt">Generate Nutrition / Recovery Tip</text>
<path d="M600 1120 V1160" class="line"/>
<rect x="390" y="1160" width="420" height="80" rx="12" class="box"/><text x="600.0" y="1194.0" class="txt">Save User and Plan</text><text x="600.0" y="1222.0" class="txt small">SQLite database</text>
<path d="M600 1240 V1280" class="line"/>
<rect x="390" y="1280" width="420" height="80" rx="12" class="box"/><text x="600.0" y="1314.0" class="txt">Display 7-Day Plan and Tip</text><text x="600.0" y="1342.0" class="txt small">Result page</text>
<path d="M600 1360 V1400" class="line"/>
<polygon points="600,1400 790.0,1465.0 600,1530 410.0,1465.0" class="decision"/><text x="600" y="1473.0" class="txt">Feedback given?</text>
<path d="M790 1465 H880" class="line"/>
<text x="815" y="1455" class="txt small" style="text-anchor:start">Yes</text>
<rect x="880" y="1425" width="280" height="80" rx="12" class="box"/><text x="1020.0" y="1459.0" class="txt">Send plan + feedback</text><text x="1020.0" y="1487.0" class="txt small">to AI service</text>
<path d="M1020 1505 V1580" class="line"/>
<rect x="880" y="1580" width="280" height="90" rx="12" class="box"/><text x="1020.0" y="1619.0" class="txt">Save updated plan</text><text x="1020.0" y="1647.0" class="txt small">Show success message</text>
<path d="M880 1625 H810 V1625" class="line"/>
<path d="M600 1530 V1580" class="line"/>
<text x="615" y="1562" class="txt small" style="text-anchor:start">No</text>
<rect x="390" y="1580" width="420" height="90" rx="12" class="box"/><text x="600.0" y="1619.0" class="txt">Admin / Coach Views Users</text><text x="600.0" y="1647.0" class="txt small">/view-all-users (optional)</text>
<path d="M600 1670 V1720" class="line"/>
<rect x="450" y="1720" width="300" height="70" rx="35" class="box"/><text x="600.0" y="1763.0" class="txt">END</text>
</svg>
